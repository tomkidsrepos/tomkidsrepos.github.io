name: Add OTA App
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL or Google Drive Link to the .ipa file"
        required: true
        type: string
      category:
        description: "Select Category"
        required: true
        type: choice
        options:
          - Mạng Xã Hội
          - Trò Chơi
          - Công Cụ
          - Giải Trí
          - Khác
        default: "Trò Chơi"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install --yes aria2 python3 pipx
          pipx install gdown

      - name: Download IPA
        run: |
          mkdir -p work_ota
          url="${{ inputs.ipa_url }}"
          
          if [[ "$url" == *"drive.google.com"* ]]; then
            file_id=$(echo "$url" | sed -E 's|.*/d/([a-zA-Z0-9_-]+).*|\1|')
            if [[ "$file_id" == "$url" ]]; then file_id=$(echo "$url" | sed -E 's|.*id=([a-zA-Z0-9_-]+).*|\1|'); fi
            if [[ "$file_id" != "$url" && -n "$file_id" ]]; then
              gdown "https://drive.google.com/uc?id=$file_id" -O "work_ota/app.ipa"
            else
              echo "Invalid Google Drive link"
              exit 1
            fi
          else
            aria2c -s16 -x16 --allow-overwrite=true --follow-torrent=false --follow-metalink=false --dir=work_ota --out=app.ipa "$url"
          fi
          
          # Check if the downloaded file is actually a valid ZIP (IPA)
          if ! unzip -t work_ota/app.ipa >/dev/null 2>&1; then
            echo "::error::File tải về không phải là file IPA hợp lệ! (Lỗi: File is not a zip file). Hãy kiểm tra lại link!"
            exit 1
          fi

      - name: Upload IPA to GitHub Releases
        id: upload_release
        run: |
          gh release view "OTA-Storage" >/dev/null 2>&1 || gh release create "OTA-Storage" --title "OTA Storage" --notes "Direct links for OTA IPAs"
          
          TS=$(date +%s)
          SAFE_NAME="app_$TS.ipa"
          mv work_ota/app.ipa work_ota/$SAFE_NAME
          
          gh release upload "OTA-Storage" work_ota/$SAFE_NAME --clobber
          
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/OTA-Storage/$SAFE_NAME"
          echo "DOWNLOAD_URL=$REPO_URL" >> $GITHUB_ENV

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Process IPA and Update Web Data
        run: |
          python3 ota_automator.py "work_ota/$(ls work_ota | grep \.ipa)" "${{ inputs.category }}" "$DOWNLOAD_URL"

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-added new OTA app"
          file_pattern: "ota_data.json ota_apps/*"
          push_options: "--force-with-lease"
